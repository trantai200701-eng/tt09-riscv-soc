# Tiny Tapeout project information
yaml_version: 6

project:
  title:        "CTW RISC-V SoC (Minimalist)"
  author:       "Tran Tan Tai"
  discord:      ""
  description:  "A minimal RISC-V RV32E SoC with internal RAM and XIP from SPI Flash."
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? 
  tiles: "4x2" 

  # Your top module name must match the Verilog file exactly
  top_module:  "tt_um_ctw_riscv_soc"

  # Source files (under the src directory)
  source_files:
    - "tt_um_ctw_riscv_soc.v"
    - "simple_cpu.v"
    - "spi_xip.v"

# The pinout of your project. Leave unused pins blank. DO NOT CHANGE THE ORDER.
pinout:
  # Inputs (ui_in)
  ui[0]: "SPI MISO (Flash Data In)"
  ui[1]: "GPIO In 1"
  ui[2]: "GPIO In 2"
  ui[3]: "GPIO In 3"
  ui[4]: "GPIO In 4"
  ui[5]: "GPIO In 5"
  ui[6]: "GPIO In 6"
  ui[7]: "GPIO In 7"

  # Outputs (uo_out)
  uo[0]: "SPI MOSI (Flash Cmd)"
  uo[1]: "SPI CS_n (Flash Select)"
  uo[2]: "SPI SCK (Flash Clock)"
  uo[3]: "UART TX (Debug Output)"
  uo[4]: "GPIO Out 0 (LED 0)"
  uo[5]: "GPIO Out 1 (LED 1)"
  uo[6]: "GPIO Out 2 (LED 2)"
  uo[7]: "GPIO Out 3 (LED 3)"

  # Bidirectional (uio)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Docs formatting
documentation: 
  author:       "Tran Tan Tai"
  title:        "CTW RISC-V SoC"
  language:     "Verilog"
  description:  "Experimental RISC-V SoC running entirely from SPI Flash (XIP)."

# Verification settings
test:
  openlane:
    pass: true
